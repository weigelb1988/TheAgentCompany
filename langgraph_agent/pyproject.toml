[tool.poetry]
name = "langgraph-agent"
version = "0.1.0"
description = "LangGraph-based agent for TheAgentCompany benchmark using local vLLM"
authors = ["TheAgentCompany Team"]
readme = "README.md"
packages = [{include = "langgraph_agent"}]

[tool.poetry.dependencies]
python = "^3.10"
langgraph = "^0.2.0"
langchain = "^0.3.0"
langchain-core = "^0.3.0"
langchain-openai = "^0.2.0"
openai = "^1.50.0"
playwright = "^1.48.0"
httpx = "^0.27.0"
pydantic = "^2.9.0"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
black = "^24.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
